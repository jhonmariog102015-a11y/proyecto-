<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria Integral | Cuidado Profesional</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="contenedor">
            <div class="logo">VETERINARIA</div>
            <div class="nav-links" id="navLinks">
                <a href="#">Inicio</a>
                <a href="#">Servicios</a>
                <button class="btn-login">
                    <i class="fas fa-user-circle"></i> Iniciar Sesión
                </button>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="contenedor hero-grid">
            <div class="hero-texto">
                <h1>Veterinaria <br> <span>Integral</span></h1>
                <p>Cuidamos a tus amigos de cuatro patas con amor y profesionalismo.</p>
                <div class="hero-botones">
                    <button class="btn-principal">Conocer Más</button>
                    <button class="btn-segundario">
                        <i class="fab fa-whatsapp"></i> Llamar ahora
                    </button>
                </div>
            </div>
            <div class="hero-imagen">
                <img src="L6GI2ZSXFZGADESR57UO666ZE4.jpg" alt="Mascota">
            </div>
        </div>
    </section>

    <section class="servicios-seccion">
        <div class="contenedor grid-servicios">
            <div class="card"><i class="fas fa-stethoscope"></i><h3>Consultorios</h3></div>
            <div class="card"><i class="fas fa-syringe"></i><h3>Vacunación</h3></div>
            <div class="card"><i class="fas fa-pills"></i><h3>Cuidados Especiales</h3></div>
            <div class="card"><i class="fas fa-calendar-alt"></i><h3>Agendar Cita</h3></div>
            <div class="card"><i class="fas fa-shopping-cart"></i><h3>Productos</h3></div>
            <div class="card"><i class="fas fa-shower"></i><h3>Baños y Estética</h3></div>
        </div>
    </section>

    <section class="testimonios">
        <div class="contenedor">
            <h2>Nuestra Experiencia</h2>
            <div class="testimonios-grid">
                <div class="testi-card">
                    <div class="estrellas">★★★★★</div>
                    <p>"Excelente atención, muy recomendados."</p>
                    <strong>- Juan Pérez</strong>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
